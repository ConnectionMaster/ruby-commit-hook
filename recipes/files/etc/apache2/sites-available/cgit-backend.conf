# The hop behind Anubis. Anubis does not terminate TLS and does not run CGI,
# so cgit needs a plain HTTP listener of its own:
#
#   client -> :443 (TLS, redirects, UA blocks) -> Anubis :8923 -> :3001 -> cgit
#
# Git clone requests skip the Anubis hop and come here directly from :443.
#
# Bound to loopback, so nothing off-host can reach cgit without passing the
# :443 vhost first. The Listen directive lives here rather than in ports.conf
# to keep the whole backend described by one file.

Listen 127.0.0.1:3001

<VirtualHost *:3001>
        ServerName git.ruby-lang.org
        ServerAdmin webmaster@ruby-lang.org

        DocumentRoot /var/www/git.ruby-lang.org

        # cgit itself is wired up by conf-enabled/cgit.conf, which applies to
        # every vhost on this server.

        # Both Anubis and the :443 vhost pass the original client address in
        # X-Real-IP. Without this, every request here is logged as 127.0.0.1.
        RemoteIPHeader X-Real-IP
        RemoteIPTrustedProxy 127.0.0.1/32

        # Keep this vhost out of other_vhosts_access.log. The :443 vhost
        # already logs every request there and that is the file Datadog tails,
        # so sharing it would double-count and hide requests Anubis rejected.
        CustomLog ${APACHE_LOG_DIR}/cgit_backend_access.log combined
</VirtualHost>
