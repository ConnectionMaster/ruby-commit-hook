<VirtualHost *:80>
        ServerName git.ruby-lang.org
        ServerAdmin webmaster@ruby-lang.org

        # for let's encrypt
        DocumentRoot /var/www/git.ruby-lang.org

        Alias /.well-known/ "/var/www/git.ruby-lang.org/.well-known/"
        <Directory "/var/www/git.ruby-lang.org/.well-known/">
                AllowOverride None
                Options Indexes FollowSymlinks
                Require all granted
        </Directory>

        RedirectMatch permanent ^/(?!.well-known)(.*) https://git.ruby-lang.org/$1
</VirtualHost>

<VirtualHost *:443>
        ServerName git.ruby-lang.org
        ServerAdmin webmaster@ruby-lang.org

        SSLEngine on
        SSLCertificateFile    /etc/letsencrypt/live/git.ruby-lang.org-0001/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/git.ruby-lang.org-0001/privkey.pem

        TimeOut 300

        DocumentRoot /var/www/git.ruby-lang.org

        ProxyRequests Off
        ProxyVia Off
        ProxyPreserveHost On

        # Anubis refuses to start serving without these. X-Forwarded-For is
        # dropped first so a client cannot forge the address Anubis judges it
        # by; mod_proxy re-adds the header with the real peer address.
        RequestHeader unset X-Forwarded-For
        RequestHeader set X-Real-Ip expr=%{REMOTE_ADDR}
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Http-Version expr=%{SERVER_PROTOCOL}

        # Rewrite the Location headers cgit and Anubis send back. Note that
        # there is deliberately no ProxyPass here: mod_proxy and mod_rewrite
        # both hook uri-to-filename, and mixing the two makes the order the
        # rules below run in depend on module load order. Every proxied route
        # is a RewriteRule with [P] so there is exactly one ordered ruleset.
        ProxyPassReverse / http://127.0.0.1:8923/
        ProxyPassReverse / http://127.0.0.1:3001/

        RewriteEngine On

        # Serve robots.txt as a static file. cgit's "ScriptAlias /" would
        # otherwise route it to cgit.cgi (returning 404), so crawlers never
        # see the Disallow rule. mod_rewrite runs before mod_alias, so this
        # bypasses the ScriptAlias.
        RewriteRule ^/robots\.txt$ /var/www/git.ruby-lang.org/robots.txt [L]

        # Crawlers that name themselves, refused before they cost us anything.
        # Anubis denies these too, but this also covers the git clone paths,
        # which are routed around Anubis. It does nothing about the ~85% of the
        # scraper traffic that forges a desktop browser user agent; that is
        # what the proof-of-work challenge is for.
        RewriteCond %{HTTP_USER_AGENT} (AI2Bot|Amazonbot|anthropic-ai|Bytespider|ChatGPT-User|ClaudeBot|Claude-SearchBot|Claude-User|cohere-ai|Diffbot|FacebookBot|GPTBot|ICC-Crawler|ImagesiftBot|img2dataset|meta-externalagent|meta-externalfetcher|meta-webindexer|MistralAI-User|OAI-SearchBot|omgili|PanguBot|PerplexityBot|Perplexity-User|PetalBot|Scrapy|SemrushBot|Timpibot|VelenPublicWebCrawler|YouBot) [NC]
        RewriteRule ^ - [F,L]

        # Browse by commit id -> GitHub. Browsing by ref (h=) went back to
        # cgit on 2026-08-31; these three rules and the id2= one below are all
        # that is left.
        #
        # Anubis validated 24,407 of the 266,560 challenges it issued between
        # 2026-08-19 and 08-31, so budget 9% of a rule's traffic as work cgit
        # will actually do. Measured over 08-24 to 08-30 that is 194 req/h
        # (id= plain), 238 (id= log/commit/diff/patch) and 463 (id= tree)
        # against the 82 req/h cgit renders today. Relax one rule at a time
        # and measure in between.
        RewriteCond %{QUERY_STRING} (?:^|&)id=([0-9a-fA-F]{7,40})
        RewriteRule ^/ruby\.git/(?:log|commit|diff|patch)(?:/.*)?$ https://github.com/ruby/ruby/commit/%1 [R=302,L,NE,QSD]
        RewriteCond %{QUERY_STRING} (?:^|&)id=([0-9a-fA-F]{7,40})
        RewriteRule ^/ruby\.git/tree/(.*)$ https://github.com/ruby/ruby/tree/%1/$1 [R=302,L,NE,QSD]
        RewriteCond %{QUERY_STRING} (?:^|&)id=([0-9a-fA-F]{7,40})
        RewriteRule ^/ruby\.git/plain/(.*)$ https://github.com/ruby/ruby/raw/%1/$1 [R=302,L,NE,QSD]

        # Range diffs (id2= without id=) are the heaviest cgit operation,
        # but only 5 req/h ask for one, so relaxing this alone would
        # measure nothing.
        RewriteCond %{QUERY_STRING} (?:^|&)id2=([0-9a-fA-F]{7,40})
        RewriteRule ^/ruby\.git/(?:diff|patch)(?:/.*)?$ https://github.com/ruby/ruby/compare/%1...master [R=302,L,NE,QSD]

        # Everything past this point is proxied. The redirects above run first
        # on purpose: traffic we hand to GitHub should never pay for a
        # challenge, and it is the bulk of what the scrapers ask for.

        # Clone over HTTPS goes straight to cgit. cgit speaks the dumb HTTP
        # protocol (enable-http-clone=1), so a clone is plain GETs of HEAD,
        # info/refs and objects/. A challenge here would break `git clone`
        # outright, and git cannot solve one.
        RewriteRule ^/([^/]+\.git)/(HEAD|info/refs|objects/.*|git-upload-pack|git-receive-pack)$ http://127.0.0.1:3001/$1/$2 [P,L]

        # cgit's stylesheet and logo. Static files, nothing to gate.
        RewriteRule ^/(cgit-css/.*)$ http://127.0.0.1:3001/$1 [P,L]

        # Everything else renders a dynamic cgit page. Anubis decides who gets
        # one.
        RewriteRule ^/(.*)$ http://127.0.0.1:8923/$1 [P,L]
</VirtualHost>
